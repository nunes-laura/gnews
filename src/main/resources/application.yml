spring:
  application:
    name: gnews-mock-api

  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: 
    
  h2:
    console:
      enabled: true
      path: /h2-console
      
  sql:
    init:
      mode: always

server:
  port: 8080

gnews:
  api-key: "test-api-key"
  rate-limit:
    daily-requests: 100
