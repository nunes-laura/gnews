name: AI Code Review (Baixo Custo)

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # Necessário para comentar no PR
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI Reviewer
        uses: anc95/ChatGPT-CodeReview@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.AI_API_KEY }}
          LANGUAGE: Portuguese
          MODEL: gpt-3.5-turbo          # Modelo barato e rápido
          TEMPERATURE: 0.5               # Mais conservador, respostas objetivas
          MAX_TOKENS: 1024               # Limite de tokens para economizar
          PROMPT: |
            Aja como um Engenheiro de Segurança Sênior (DevSecOps).
            Analise o DIFF deste Pull Request buscando:
            1. Vulnerabilidades OWASP Top 10 (ex: SQL Injection, Insecure Deserialization)
            2. Code smells e complexidade ciclomática desnecessária
            3. Aderência às melhores práticas de Java 25 e Spring Boot 3.4
            4. Responda com comentários técnicos e construtivos diretamente nas linhas do código afetado.
