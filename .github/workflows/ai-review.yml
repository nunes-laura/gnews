name: Gemini AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture PR Diff
        run: |
          git fetch origin main
          git diff origin/main > diff.txt
          head -n 2000 diff.txt > diff_limited.txt

      - name: Gemini AI Review
        run: |
          DIFF=$(cat diff_limited.txt)

          PAYLOAD=$(jq -n --arg diff "$DIFF" '{
            contents: [{
              role: "user",
              parts: [{
                text: (
                  "Você está participando do desafio acadêmico \"O Ataque ao GNews\".\n\n" +
                  "Analise o DIFF abaixo e responda OBJETIVAMENTE:\n" +
                  "1. Existe vulnerabilidade de SQL Injection?\n" +
                  "2. Aponte exatamente o trecho vulnerável.\n" +
                  "3. Explique por que é inseguro.\n" +
                  "4. Sugira a correção usando PreparedStatement ou JdbcTemplate seguro.\n\n" +
                  "DIFF:\n" + $diff
                )
              }]
            }],
            generationConfig: {
              temperature: 0.2,
              maxOutputTokens: 1024
            }
          }')

          RESPONSE=$(curl -s -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${{ secrets.AI_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text' > review.txt

      - name: Comment on PR
        run: |
          BODY=$(cat review.txt | jq -Rs .)

          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            -d "{\"body\": $BODY}"
